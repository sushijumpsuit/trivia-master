# Test the backend on every push, then redeploy it to the EC2 server if the tests pass.
# Setup (once): add repository secrets EC2_HOST and EC2_SSH_KEY, and the variable API_URL.
name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:          # "Run workflow" button for a manual redeploy

concurrency:
  group: deploy-backend       # never run two deploys at once
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q           # uses a fake LLM, so no API key or cost

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/trivia-master
            git pull --ff-only
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Check the live backend is healthy
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.API_URL }}/health"; then exit 0; fi
            echo "not ready yet, retrying in 10s"; sleep 10
          done
          echo "backend did not become healthy"; exit 1
